<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業務管理 / Work Tracker</title>
  <style>
    :root {
      --bg-top: #f8fafc;
      --bg-mid: #f2f7f6;
      --bg-bottom: #faf7f0;

      --card: rgba(255, 255, 255, 0.92);
      --card-border: #dfe7e5;
      --card-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);

      --text-main: #334155;
      --text-sub: #64748b;
      --text-soft: #94a3b8;

      --primary: #4f8f87;
      --primary-hover: #3f7770;
      --primary-soft: #e9f4f2;

      --line: #e2e8f0;
      --danger: #e57373;
      --danger-bg: #fff1f1;

      --badge-gray-bg: #f8fafc;
      --badge-gray-text: #5b6470;
      --badge-teal-bg: #edf7f5;
      --badge-teal-text: #467c75;
      --badge-amber-bg: #fff7e9;
      --badge-amber-text: #a07a2f;
      --badge-rose-bg: #fff1f1;
      --badge-rose-text: #c15d5d;

      --todo-bg: #f8fafc;
      --todo-text: #64748b;

      --doing-bg: #edf7f5;
      --doing-text: #467c75;

      --waiting-bg: #fff7e9;
      --waiting-text: #a07a2f;

      --follow-bg: #fff1f1;
      --follow-text: #c15d5d;

      --done-bg: #eef8ef;
      --done-text: #5d8a63;

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
        "Yu Gothic", sans-serif;
      color: var(--text-main);
      background: linear-gradient(to bottom, var(--bg-top), var(--bg-mid), var(--bg-bottom));
      min-height: 100vh;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .header {
      margin-bottom: 20px;
    }

    .title {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text-main);
    }

    .subtitle {
      margin-top: 8px;
      color: var(--text-sub);
      font-size: 14px;
    }

    .toolbar,
    .stats,
    .form-grid,
    .list {
      display: grid;
      gap: 14px;
    }

    .toolbar {
      grid-template-columns: minmax(220px, 1.4fr) 180px 180px auto;
      margin-bottom: 18px;
    }

    .toolbar-actions {
      display: flex;
      gap: 10px;
      white-space: nowrap;
    }

    .stats {
      grid-template-columns: repeat(4, 1fr);
      margin-bottom: 18px;
    }

    .stat-card,
    .panel,
    .task-card,
    .modal-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--card-shadow);
    }

    .stat-card {
      padding: 18px 18px 16px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
    }

    .panel {
      padding: 16px;
      margin-bottom: 18px;
    }

    .panel-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: var(--radius-md);
      padding: 11px 13px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-soft);
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #a7c9c3;
      box-shadow: 0 0 0 4px rgba(79, 143, 135, 0.08);
    }

    textarea {
      resize: vertical;
      min-height: 92px;
      line-height: 1.6;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: white;
      color: var(--text-main);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      background: #fafafa;
    }

    .btn-danger {
      background: #fff;
      color: var(--danger);
      border: 1px solid #f4cccc;
    }

    .btn-danger:hover {
      background: #fff8f8;
    }

    .list {
      grid-template-columns: 1fr;
    }

    .task-card {
      padding: 18px;
      transition: 0.18s ease;
    }

    .task-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }

    .task-card.overdue {
      border-color: #efb0b0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.95), rgba(255,248,248,0.95));
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    .task-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      line-height: 1.4;
    }

    .task-date {
      color: var(--text-soft);
      font-size: 12px;
      white-space: nowrap;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .badge.category {
      background: var(--badge-teal-bg);
      color: var(--badge-teal-text);
      border-color: #d8ece8;
    }

    .badge.priority {
      background: var(--badge-amber-bg);
      color: var(--badge-amber-text);
      border-color: #f2e4c0;
    }

    .badge.overdue {
      background: var(--badge-rose-bg);
      color: var(--badge-rose-text);
      border-color: #f1d2d2;
    }

    .badge.todo { background: var(--todo-bg); color: var(--todo-text); border-color: #e5e7eb; }
    .badge.doing { background: var(--doing-bg); color: var(--doing-text); border-color: #d7ebe7; }
    .badge.waiting { background: var(--waiting-bg); color: var(--waiting-text); border-color: #f2e4c0; }
    .badge.follow { background: var(--follow-bg); color: var(--follow-text); border-color: #f1d2d2; }
    .badge.done { background: var(--done-bg); color: var(--done-text); border-color: #dcebdc; }

    .task-body {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.65;
    }

    .field-label {
      color: var(--text-sub);
      font-weight: 700;
      margin-right: 6px;
    }

    .task-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .empty {
      text-align: center;
      color: var(--text-sub);
      padding: 42px 16px;
      background: rgba(255,255,255,0.7);
      border: 1px dashed #d7dfdf;
      border-radius: var(--radius-xl);
    }

    .quick-filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .quick-pill {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text-sub);
      cursor: pointer;
    }

    .quick-pill.active {
      background: var(--primary-soft);
      color: var(--primary-hover);
      border-color: #d6ebe8;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.25);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(760px, 100%);
      padding: 20px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.98), rgba(250,247,240,0.98));
    }

    .modal-title {
      margin: 0 0 16px;
      font-size: 22px;
      color: var(--text-main);
    }

    .form-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .full {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }

    @media (max-width: 900px) {
      .toolbar,
      .stats,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .toolbar-actions {
        flex-direction: column;
      }

      .task-top {
        flex-direction: column;
      }
    }

    body { font-size: 16px; }
    button, input, select, textarea { font: inherit; }
    .subtitle, .section-label, .badge, .quick-pill, .stat-label { font-size: 14px; }
    .toolbar { grid-template-columns: minmax(180px, 1fr) 220px 150px; }
    .toolbar-actions { flex-wrap: wrap; margin-top: 14px; }
    .weekbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:20px 0; }
    .weekbar input { width:165px; }
    .week-label { font-weight:700; margin-right:auto; }
    .muted { color:var(--text-sub); font-size:14px; }
    .stat-note { color:var(--text-sub); font-size:14px; margin-top:6px; }
    .task-body { font-size:16px; }
    .task-body > div, .log-text { white-space:pre-wrap; overflow-wrap:anywhere; }
    .task-top, .task-title { overflow-wrap:anywhere; min-width:0; }
    .log-entry { padding:14px 0; border-top:1px solid var(--line); }
    .log-meta { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:14px; color:var(--text-sub); }
    .log-meta button { padding:6px 10px; font-size:14px; }
    .log-text { margin-top:8px; line-height:1.65; }
    details { margin-top:14px; }
    summary { cursor:pointer; color:var(--primary-hover); padding:8px 0; }
    dialog { border:1px solid var(--card-border); border-radius:24px; width:min(760px, calc(100% - 24px)); max-height:90vh; padding:24px; color:var(--text-main); background:#fff; }
    dialog::backdrop { background:rgba(15,23,42,.3); }
    .modal-title { font-size:22px; }
    .notice { padding:12px 16px; border:1px solid #c9dfdb; background:#edf7f5; border-radius:14px; line-height:1.6; margin:12px 0; overflow-wrap:anywhere; }
    .notice.error { background:#fff1f1; border-color:#f4cccc; }
    [hidden] { display:none !important; }
    .form-actions { position:sticky; bottom:-24px; background:#fff; padding:12px 0; }
    .secondary-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    .footer-note { margin-top:18px; line-height:1.6; }
    :focus-visible { outline:3px solid #4f8f87; outline-offset:3px; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    @media(max-width:900px) { .toolbar { grid-template-columns:1fr; } .toolbar-actions { flex-direction:row; } }
    @media(max-width:600px) { .page { padding:20px 14px 40px; } .title { font-size:26px; } .stats { grid-template-columns:1fr 1fr; } .week-label { width:100%; } .weekbar { gap:8px; } dialog { padding:18px; } }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1 class="title">業務管理 / Work Tracker</h1>
      <p class="subtitle">日常記録・案件フォロー</p>
    </header>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <section id="recovery" class="panel" hidden>
      <h2>保存データを読み込めませんでした</h2>
      <p>元のデータは変更していません。まず原本をダウンロードして保管してください。</p>
      <button id="rawBackupBtn" class="btn-secondary">保存データの原本をダウンロード</button>
    </section>
    <div id="workspace">
      <section class="weekbar" aria-label="対象週">
        <span id="weekLabel" class="week-label"></span>
        <button id="prevWeek" class="btn-secondary" aria-label="前の週">前週</button>
        <label for="weekDate" class="muted">日付から選択</label><input type="date" id="weekDate" required min="1000-01-01" max="9999-12-31">
        <button id="nextWeek" class="btn-secondary" aria-label="次の週">翌週</button>
        <button id="thisWeek" class="btn-secondary">今週</button>
      </section>
      <div class="stats" id="stats" aria-label="選択週の集計"></div>
      <section class="panel" aria-label="記録の絞り込み">
        <div class="toolbar">
          <input id="searchInput" type="search" placeholder="案件・対応内容を検索" aria-label="案件・対応内容を検索">
          <select id="categoryFilter" aria-label="業務分類"></select>
          <select id="statusFilter" aria-label="現在の状態"></select>
        </div>
        <div class="quick-filters" aria-label="表示切替">
          <button class="quick-pill active" data-view="week">選択週</button>
          <button class="quick-pill" data-view="today">今日優先</button>
          <button class="quick-pill" data-view="all">全案件</button>
          <button class="quick-pill" data-view="follow">要フォロー</button>
          <button class="quick-pill" data-view="waiting">先方待ち</button>
          <button class="quick-pill" data-view="overdue">期限超過</button>
        </div>
        <div class="toolbar-actions">
          <button class="btn-primary" id="newTaskBtn">＋ 記録・案件を追加</button>
          <button class="btn-secondary" id="reportBtn">選択週の週報メモ</button>
          <button class="btn-secondary" id="weekCsvBtn">選択週の対応 CSV</button>
        </div>
        <p class="muted" id="scopeNote"></p>
      </section>
      <div class="list" id="taskList"></div>
      <div class="secondary-actions">
        <button class="btn-secondary" id="backupBtn">全件バックアップ（JSON）</button>
        <button class="btn-secondary" id="importBtn">バックアップ・旧 CSV を取り込む</button>
        <button class="btn-secondary" id="downloadBtn">全件 CSV</button>
        <input type="file" id="importFile" accept=".json,.csv,application/json,text/csv" hidden>
      </div>
      <p class="muted footer-note">保存先はこのブラウザーです。別の端末・URL へ移すときは JSON バックアップを取り込んでください。CSV は閲覧・集計用です。</p>
    </div>
  </main>
  <dialog id="taskDialog" aria-labelledby="modalTitle">
    <form id="taskForm">
      <h2 class="modal-title" id="modalTitle">記録・案件を追加</h2>
      <div class="form-grid">
        <div><label class="section-label" for="taskDate">受付日</label><input type="date" id="taskDate" min="1000-01-01" max="9999-12-31"></div>
        <div><label class="section-label" for="taskCategory">業務分類</label><select id="taskCategory" required></select></div>
        <div><label class="section-label" for="taskSubcategory">詳細分類</label><select id="taskSubcategory"></select></div>
        <div><label class="section-label" for="taskPriority">優先度</label><select id="taskPriority"></select></div>
        <div class="full"><label class="section-label" for="taskTitle">案件・事項</label><input id="taskTitle" required maxlength="500" placeholder="何についての対応ですか？"></div>
        <div><label class="section-label" for="taskStatus">現在の状態</label><select id="taskStatus"></select></div>
        <div><label class="section-label" for="taskDue">次回対応日・期限（任意）</label><input type="date" id="taskDue" min="1000-01-01" max="9999-12-31"></div>
        <div class="full"><label class="section-label" for="taskPlan">予定・目的（任意）</label><textarea id="taskPlan"></textarea></div>
        <div class="full"><label class="section-label" for="taskNext">次アクション（任意）</label><textarea id="taskNext" placeholder="何を待っているか、次に何をするか"></textarea></div>
        <div class="full" id="initialLogFields">
          <label class="section-label" for="taskActual">今回の対応（任意）</label><textarea id="taskActual" placeholder="実際に進めたこと"></textarea>
          <div class="form-grid">
            <div><label class="section-label" for="initialLogDate">対応日</label><input type="date" id="initialLogDate" min="1000-01-01" max="9999-12-31"></div>
            <div><label class="section-label" for="initialMinutes">作業時間・分（任意）</label><input type="number" id="initialMinutes" min="0" max="1440" step="1" placeholder="例：20"></div>
          </div>
        </div>
      </div>
      <div class="form-actions"><button type="button" class="btn-secondary" data-close="taskDialog">キャンセル</button><button type="submit" class="btn-primary">保存</button></div>
    </form>
  </dialog>
  <dialog id="logDialog" aria-labelledby="logTitle">
    <form id="logForm">
      <h2 class="modal-title" id="logTitle">対応を記録</h2>
      <p id="logCase" class="muted"></p>
      <div class="form-grid">
        <div><label class="section-label" for="logDate">対応日</label><input type="date" id="logDate" required min="1000-01-01" max="9999-12-31"></div>
        <div><label class="section-label" for="logMinutes">作業時間・分（任意）</label><input type="number" id="logMinutes" min="0" max="1440" step="1"></div>
        <div class="full"><label class="section-label" for="logText">実際に対応した内容</label><textarea id="logText" required></textarea></div>
        <div class="full" id="logNextFields">
          <div class="form-grid">
            <div><label class="section-label" for="logStatus">現在の状態</label><select id="logStatus"></select></div>
            <div><label class="section-label" for="logDue">次回対応日・期限（任意）</label><input type="date" id="logDue" min="1000-01-01" max="9999-12-31"></div>
          </div>
          <label class="section-label" for="logNext">次アクション（任意）</label><textarea id="logNext"></textarea>
        </div>
      </div>
      <div class="form-actions"><button type="button" class="btn-secondary" data-close="logDialog">キャンセル</button><button type="submit" class="btn-primary">保存</button></div>
    </form>
  </dialog>
  <script src="tracker-core.js"></script>
  <script src="tracker-app.js"></script>
</body>
</html>
